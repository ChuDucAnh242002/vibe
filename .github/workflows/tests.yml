name: Run Python Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Python 3.11 backend image
        run: docker build -t vibe-backend-ci -f src/backend/Dockerfile .
      - name: Check application imports
        run: |
          docker run --rm --entrypoint python vibe-backend-ci -W error::Warning:requests -c 'import requests'
          docker run --rm --entrypoint python vibe-backend-ci -c 'from sentence_transformers import SentenceTransformer; from langchain_huggingface import HuggingFaceEmbeddings'
          docker run --rm -e RUNNING_IN_DOCKER=true --entrypoint python vibe-backend-ci app.py --help
  devbox-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@734088efddca47cf44ff8a09289c6d0e51b73218 # v0.12.0
        with:
          devbox-version: 0.22.0
          enable-cache: 'false'
          disable-nix-access-token: 'true'
      - run: |
          devbox run doctor
          devbox run setup-test
          devbox run test
          git diff --exit-code -- devbox.json devbox.lock
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: psf/black@8a737e727ac5ab2f1d4cf5876720ed276dc8dc4b # 25.1.0
        with:
          version: '25.1.0'
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install pip Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/requirements.txt

      - name: Run Tests
        run: |
          pytest --junitxml=test-results.xml --cov=. --cov-report=term --cov-report=xml --cov-config=.coveragerc test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-test-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 7
