services:
  app:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: vibe-app-image:latest
    volumes:
      - ./models:/models
      - ./documents:/documents
      - ./chroma_data:/usr/src/chroma_db
      - ./logs:/usr/src/logs
    environment:
      - PYTHONUNBUFFERED=1
      - RUNNING_IN_DOCKER=true
      - ENABLE_AUDIO=false
      - OMP_NUM_THREADS=2
      - ANONYMIZED_TELEMETRY=False
    stdin_open: true
    tty: true